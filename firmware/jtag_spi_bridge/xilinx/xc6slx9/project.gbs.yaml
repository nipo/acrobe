name: blink

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - ../../src/func.pkg.vhd
        - ../../src/jtag_spi.vhd
        - ../boundary.vhd
    - file_type: xilinx-ucf
      files:
        - pinout.ucf
  deps:
    - nsl_hwdep.clock
    - nsl_hwdep.reset
    - nsl_spi.transactor
    - nsl_bnoc.framed
    - nsl_jtag.fifo_transport
    - nsl_indication.activity


output:
  - name: synthesis
    topcell: boundary
    target:
      part: xc6slx9-2tqg144
    backend_config:
      gbs.builtin.ise: {}
    outputs:
      - type: ise-synthesis-report
        path: synthesis-report.html
      - type: ise-pnr-report
        path: pnr-report.html
      - type: ise-bitstream+gzip
        path: ../../../../acrobe/component/xilinx/fw/0x04001093_jtag_spi.bit.gz
