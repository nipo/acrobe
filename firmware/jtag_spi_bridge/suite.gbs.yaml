name: jtag-spi-bridge
description: JTAG to SPI bridge generic tool

settings:
  max_parallel_projects: 4
  stop_on_failure: false

projects:

  - name: gowin_gw1n-9c
    path: gowin/gw1n-9c
    tags: [gowin]
    # Does not work, recent gowin eda do not define GW_JTAG for gw1n
    # (older versions do, though)
    skip: true

  - name: gowin_gw5at-15a
    path: gowin/gw5at-15a
    tags: [gowin]
  - name: gowin_gw5a-25a
    path: gowin/gw5a-25a
    tags: [gowin]
  - name: gowin_gw5at-60b
    path: gowin/gw5at-60b
    tags: [gowin]

  # YMMV with yosys
  - name: lattice_ecp5-25k
    path: lattice/ecp5-25k
    tags: [lattice, yosys]
    skip: true

  - name: xilinx_xc6slx16
    path: xilinx/xc6slx16
    tags: [xilinx, ise]
  - name: xilinx_xc6slx9
    path: xilinx/xc6slx9
    tags: [xilinx, ise]
  - name: xilinx_xc7a15t
    path: xilinx/xc7a15t
    tags: [xilinx, vivado]
  - name: xilinx_xc7a35t
    path: xilinx/xc7a35t
    tags: [xilinx, vivado]
