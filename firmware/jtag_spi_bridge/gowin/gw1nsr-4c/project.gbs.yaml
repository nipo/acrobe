name: GW1NSR-4C
description: jtag_spi_bridge for GW1NSR-4C

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - ../boundary_wh.vhd
    - file_type: gowin-cst
      files:
        - pins.cst
  deps:
    - nsl_io.io
    - nsl_clocking.reset
    - nsl_clocking.oscillator
    - jtag_spi.bridge

output:
  - name: synthesis
    topcell: boundary
    exclude_dispatchers:
      - nsl_gowin_cdc
    target:
      part: GW1NSR-LV4CQN48PC7/I6
      use_as_gpio:
        - mspi
        - done
        - cpu
    outputs:
      - type: gowin-fs+gzip
        path: ../../../../acrobe/component/gowin/fw/0x0100981b_jtag_spi.fs.gz
