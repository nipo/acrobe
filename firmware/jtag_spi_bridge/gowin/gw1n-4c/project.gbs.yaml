name: GW1N-9
description: jtag_spi_bridge for GW1N-9

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - ../boundary_noled.vhd
    - file_type: gowin-cst
      files:
        - pins.cst
  deps:
    - nsl_io.io
    - nsl_clocking.reset
    - nsl_clocking.oscillator
    - jtag_spi.bridge

output:
  - name: synthesis
    topcell: boundary
    exclude_dispatchers:
      - nsl_gowin_cdc
    target:
      part: GW1N-LV4QN48C6/I5##gw1n4-002
      use_as_gpio:
        - mspi
        - cpu
    outputs:
      - type: gowin-fs+gzip
        path: ../../../../acrobe/component/gowin/fw/0x0100481b_jtag_spi.fs.gz
