name: jtag_spi_bridge-0x0001281b
description: jtag_spi_bridge for GW5A-25

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - ../boundary.vhd
    - file_type: gowin-cst
      files:
        - pins.cst
  deps:
    - nsl_io.io
    - nsl_hwdep.reset
    - nsl_hwdep.clock
    - jtag_spi.bridge

output:
  - name: synthesis
    topcell: boundary
    target:
      part: GW5A-LV25MG121NC1/I0#A
      use_as_gpio:
        - mspi
        - done
        - cpu
    outputs:
      - type: gowin-fs+gzip
        path: ../../../../acrobe/component/gowin/fw/0x0001281b_jtag_spi.fs.gz
